<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Onur Ozan Sünger | Computer Engineer | MSc Data Science</title>
<desc id="desc">A dark terminal-style profile header with cyan and violet orbital animation. Computer Engineer, MSc Data Science, Sapienza University of Rome. Python, PyTorch and FastAPI.</desc>
<defs>
<linearGradient id="bg" x2="100%" y2="100%"><stop stop-color="#070A13"/><stop offset="1" stop-color="#111125"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#5146A5" stop-opacity=".30"/><stop offset="1" stop-color="#5146A5" stop-opacity="0"/></radialGradient>
<linearGradient id="edge"><stop stop-color="#64F4DF"/><stop offset=".48" stop-color="#8183FF"/><stop offset="1" stop-color="#C07BFF"/></linearGradient>
<linearGradient id="scan"><stop stop-color="#5EECD5" stop-opacity="0"/><stop offset=".5" stop-color="#99FFF0"/><stop offset="1" stop-color="#A98AFF" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8990BA" stroke-opacity=".06"/></pattern>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
<clipPath id="frame"><rect width="1200" height="400" rx="18"/></clipPath>
<clipPath id="rail"><rect x="46" y="365" width="1108" height="2"/></clipPath>
</defs>
<style>
.orbit { transform-box: view-box; transform-origin: 964px 220px; }
.orbit-a { animation: orbit 12s linear infinite; }
.orbit-b { animation: orbit 19s linear infinite reverse; }
.core { animation: orbit 38s linear infinite; }
.flow { animation: flow 9s linear infinite; }
.cursor { animation: cursor 1.8s steps(1,end) infinite; }
.scan { animation: scan 7s ease-in-out infinite; }
.breath { animation: breath 5s ease-in-out infinite; }
@keyframes orbit { to { transform: rotate(360deg); } }
@keyframes flow { to { stroke-dashoffset: -96; } }
@keyframes cursor { 0%,55%,100% { opacity: 1; } 56%,99% { opacity: .12; } }
@keyframes scan { 0% { transform: translateX(-180px); } 100% { transform: translateX(1260px); } }
@keyframes breath { 0%,100% { opacity: .35; } 50% { opacity: .8; } }
@media (prefers-reduced-motion: reduce) { .orbit,.flow,.cursor,.scan,.breath { animation: none; } }
</style>
