      <rect x="52" y="53" width="24" height="3" rx="1.5" fill="#79E7C6"/>
      <text x="89" y="60" fill="#8BE7CE" font-size="14" font-weight="650" letter-spacing="2.4">APPLIED MACHINE LEARNING</text>
      <text x="49" y="137" fill="#F1F6FC" font-size="56" font-weight="700" letter-spacing="-1.8">Onur Ozan Sünger</text>
      <text x="52" y="183" fill="#B8C9DD" font-size="23" font-weight="400" letter-spacing="0.1">Predictive intelligence. Reproducible systems.</text>
